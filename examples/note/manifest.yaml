# Note — the example agent: one agent, every feature the platform enforces.
#
# Read this file to learn what an agent can declare and what the platform
# enforces for it. Every function below exists to demonstrate exactly one
# thing (README.md maps them), on a domain small enough that the
# platform's rules are the only thing to notice:
#
#   permission levels 0–3, secrets with a keys/values split, data with
#   user_access, files with constraints, a schedulable
#   function the clock can run unattended, a function that thinks with
#   the chat's model, authorization scopes a policy can narrow, real pip
#   dependencies installed into the agent's own environment, the hosts
#   it connects to, x-resource references in inputs and outputs, and
#   JSON Schema on every side —
#   and, in code, a table it offers (call.show), a report it posts in its
#   own name (call.post), and a question it asks before writing (call.ask).
#
# The "remote" behind the sync tool is simulated in code — no external
# service — so installing this demonstrates the whole model without asking
# a deployment to trust anything outside itself.

schema_version: "1.0"

agent:
  id: note
  name: Note
  version: "1.2.3"
  description: >
    Your working memory across conversations. Save what was decided,
    find what you wrote last month, summarize a notebook, import or
    export it as a file — and the platform keeps every note as a
    record you can read and edit yourself.
  tags:
    - template
    - notes
    - productivity
  examples:
    - title: "Save a decision"
      prompt: "Save a note in the \"meetings\" notebook: we agreed to move to the new office in November and Dana leads the furniture order."
    - title: "Find what you wrote"
      prompt: "Find my notes about the Northlight chairs and summarize them in three lines."
    - title: "Take a notebook with you"
      prompt: "Export the \"meetings\" notebook as a file I can download."
  instructions: >
    Use the notebook tools only when the user wants to save, find,
    summarize, import, export, or synchronize notes. Never invent note
    contents, identifiers, file references, or sync results. A notebook is
    only a label on its notes: saving into a new name creates that
    notebook, so never refuse to save because a notebook does not exist
    yet — pick a sensible name or ask for one, then save. Ask which
    notebook to use when it is required but neither stated nor safely
    inferable. Explain before a sync because it represents an external
    write and may require approval. To watch a notebook on a cadence,
    schedule notes.find with a wake on "notes".

implementation:
  entrypoint: agent:NoteAgent
  # Two real dependencies, both used: the platform builds this agent its
  # own environment and installs exactly these — nothing shared, nothing
  # negotiated with the runtime's own packages.
  dependencies:
    - "humanize>=4.9,<5"
    - "titlecase>=2.4,<3"

# Where it connects: nowhere, because the remote is simulated. The
# list is read by whoever approves the agent, and where the platform
# confines agents a host that is not on it is refused. An agent that
# really synchronized would name its service here — or, since the
# person types the service's address into the secret below, say
#
#   hosts:
#     - from_secret: connection.base_url
#
# which is why base_url is kept in `keys`: where an agent connects
# has to be readable by the person who approves it.
network:
  hosts: []

authorization:
  scopes:
    notebook:
      type: string
      description: Notebook name, such as personal or work.
      normalization: lowercase

resources:
  secrets:
    - id: connection
      label: Notebook Sync Connection
      description: Endpoint and credential for the (simulated) remote service.
      binding: {cardinality: one, required: true}
      # A secret a person types. The other kind is a CONNECTED ACCOUNT:
      # add an `oauth` block here and the platform runs the consent
      # round-trip itself, stores the tokens, and refreshes them at use —
      # the agent still just calls use_secret. That is how the published
      # mail and calendar agents authenticate; docs/agents/manifest.md has the
      # block. A simulated remote has nothing to consent to, so this one
      # stays a typed token.
      fields:
        # `keys` stay plain metadata a person sees again; a secret's
        # `values` are encrypted at rest, never shown to a person after
        # they are typed, and reach only a function that declared `use`,
        # through use_secret. This is the contrast to learn from.
        - {name: base_url,  label: Service URL, type: string, storage: keys,   required: true}
        - {name: api_token, label: API Token,   type: secret, storage: values, required: true}

  data:
    - id: note
      label: Note
      description: One note, belonging to a notebook.
      binding: {cardinality: many, required: false}
      # A person may add and edit notes directly from the records page;
      # the platform validates their writes against these fields exactly
      # as it validates the agent's.
      user_access: [create, update]
      fields:
        - {name: title,    label: Title,    type: string, storage: keys,   required: true}
        - {name: notebook, label: Notebook, type: string, storage: keys,   required: true}
        - {name: priority, label: Priority, type: number, storage: keys,   required: false}
        # A STRING in keys, and both halves of that matter. Keys are
        # plaintext and can be filtered on; `values` are encrypted at
        # rest and cannot. The agent reads either back. A notebook of
        # private notes would keep the body in `values` and give up
        # filtering on it. And keys are scalar, so the body cannot be an
        # object here: the platform refuses one, by name, at validation.
        # See docs/agents/manifest.md, "The most consequential line you write".
        - {name: content,  label: Content,  type: string, storage: keys,   required: false}

    - id: settings
      label: Notebook Settings
      description: Per-user display and search preferences.
      binding: {cardinality: one, required: false}
      fields:
        - name: sort_order
          label: Sort Order
          type: select
          storage: keys
          required: false
          options: [updated, created, title]

  files:
    - id: document
      label: Notebook Document
      description: Exported or imported note collections.
      binding: {cardinality: many, required: false}
      # A person may upload a document to import; content is immutable, so
      # `create` is the only operation a file can offer them.
      user_access: [create]
      constraints:
        mime_types: [text/csv, application/json]
        max_size_mb: 5

tools:
  - id: notes
    name: Notes Tool
    description: Saves, reads, finds and summarizes notes.
    resources:
      data: [note, settings]
    functions:
      - id: save
        name: Save Note
        description: >
          Create a note, or update an existing one when note_ref is given.
          When a note with the same title is already in the notebook, asks
          the person whether to update it or keep both.
        permission_level: 1
        timeout_seconds: 10
        resources:
          # `list` because it looks for a note with the same title before
          # writing — the resources map lists what the code actually does.
          data: {note: [list, create, update]}
        authorization:
          scopes:
            notebook: {from_input: notebook}
        inputs:
          type: object
          additionalProperties: false
          required: [notebook, title]
          properties:
            notebook: {type: string, minLength: 1, maxLength: 60}
            title:    {type: string, minLength: 1, maxLength: 200}
            priority: {type: integer, minimum: 1, maximum: 5}
            # Kept in keys, where a filter can reach it, and a key
            # holds at most 8,192 characters.
            content:  {type: string, maxLength: 8192}
            note_ref:
              type: string
              x-resource: {type: data, id: note}
        outputs:
          type: object
          required: [note_ref, created]
          properties:
            note_ref:
              type: string
              x-resource: {type: data, id: note}
            created: {type: boolean}

      - id: get
        name: Get Note
        description: Read one note by reference.
        permission_level: 0
        timeout_seconds: 10
        resources:
          data: {note: read}
        inputs:
          type: object
          additionalProperties: false
          required: [note_ref]
          properties:
            note_ref:
              type: string
              x-resource: {type: data, id: note}
        outputs:
          type: object
          required: [note_ref, title]
          properties:
            note_ref:
              type: string
              x-resource: {type: data, id: note}
            title:    {type: string}
            notebook: {type: string}
            priority: {type: number}
            content:  {type: string, maxLength: 8192}

      - id: find
        name: Find Notes
        description: >
          List notes, optionally narrowed to one notebook and a text query.
          Safe to run unattended: a schedule can call it on a cadence and
          wake the assistant only when "notes" comes back non-empty.
        permission_level: 0
        timeout_seconds: 10
        # Runs on the clock with no model and no approval — the ceiling
        # for anything schedulable is level 1 and no llm, and a manifest
        # that breaks it is refused.
        schedulable: true
        resources:
          data:
            note: [list, read]
            settings: read
        authorization:
          scopes:
            notebook: {from_input: notebook, required: false}
        inputs:
          type: object
          additionalProperties: false
          properties:
            notebook: {type: string, maxLength: 60}
            query:    {type: string, maxLength: 200}
            limit:    {type: integer, minimum: 1, maximum: 100, default: 25}
        outputs:
          type: object
          required: [notes, total]
          properties:
            notes:
              type: array
              items:
                type: object
                properties:
                  note_ref:
                    type: string
                    x-resource: {type: data, id: note}
                  title:    {type: string}
                  notebook: {type: string}
                  priority: {type: [number, "null"]}
            total: {type: integer}

      - id: summarize
        name: Summarize Notebook
        description: >
          Condense one notebook's notes to their substance, with the chat's
          own model. Never invents notes; says so when they are thin.
        permission_level: 1
        timeout_seconds: 120
        # The one place agent code asks for a model: the platform hands
        # this invocation the chat's configured connection, and the stored
        # key never reaches the agent.
        llm: true
        resources:
          data: {note: [list, read]}
        authorization:
          scopes:
            notebook: {from_input: notebook}
        inputs:
          type: object
          additionalProperties: false
          required: [notebook]
          properties:
            notebook:  {type: string, minLength: 1, maxLength: 60}
            focus:     {type: string, maxLength: 200}
            max_words: {type: integer, minimum: 20, maximum: 500, default: 120}
        outputs:
          type: object
          required: [summary, note_count]
          properties:
            summary:    {type: string}
            note_count: {type: integer}

  - id: archive
    name: Archive Tool
    description: Exports notes to files and imports notes from files.
    resources:
      data:  [note]
      files: [document]
    functions:
      - id: export
        name: Export Notes
        description: Write one notebook's notes to a stored document.
        permission_level: 2
        timeout_seconds: 30
        resources:
          data:  {note: [list, read]}
          files: {document: create}
        authorization:
          scopes:
            notebook: {from_input: notebook}
        inputs:
          type: object
          additionalProperties: false
          required: [notebook, format]
          properties:
            notebook: {type: string, minLength: 1, maxLength: 60}
            format:   {type: string, enum: [csv, json]}
        outputs:
          type: object
          required: [file_ref, note_count]
          properties:
            file_ref:
              type: string
              x-resource: {type: file, id: document}
            filename:   {type: string}
            note_count: {type: integer}

      - id: import
        name: Import Notes
        description: Create notes from a stored document.
        permission_level: 2
        timeout_seconds: 30
        resources:
          files: {document: read}
          data:  {note: create}
        authorization:
          scopes:
            notebook: {from_input: notebook}
        inputs:
          type: object
          additionalProperties: false
          required: [notebook, file_ref]
          properties:
            notebook: {type: string, minLength: 1, maxLength: 60}
            file_ref:
              type: string
              x-resource: {type: file, id: document}
        outputs:
          type: object
          required: [note_refs, imported]
          properties:
            note_refs:
              type: array
              items:
                type: string
                x-resource: {type: data, id: note}
            imported: {type: integer}

  - id: sync
    name: Sync Tool
    description: Syncs notes with the (simulated) remote notebook service.
    resources:
      secrets: [connection]
      data:    [note]
    functions:
      - id: status
        name: Sync Status
        description: Report the remote service connection status.
        permission_level: 0
        timeout_seconds: 15
        resources:
          secrets: {connection: use}
        inputs:
          type: object
          additionalProperties: false
          properties: {}
        outputs:
          type: object
          required: [connected, remote]
          properties:
            connected: {type: boolean}
            remote:    {type: string}

      - id: push
        name: Push Notes
        description: >
          Push one notebook's notes to the remote service — external and
          irreversible, so it asks for approval in an ordinary chat.
        permission_level: 3
        timeout_seconds: 60
        resources:
          secrets: {connection: use}
          data:    {note: [list, read]}
        authorization:
          scopes:
            notebook: {from_input: notebook}
        inputs:
          type: object
          additionalProperties: false
          required: [notebook]
          properties:
            notebook: {type: string, minLength: 1, maxLength: 60}
        outputs:
          type: object
          required: [pushed, digest]
          properties:
            pushed: {type: integer}
            digest: {type: string}
