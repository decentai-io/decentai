<!-- Shown on the dialog shell (styles/controls.scss), which this
     component opens as it appears. -->
<ng-template #sheet>
  <h2 mat-dialog-title>Hand over {{ subject }}</h2>
  <mat-dialog-content>
    <p class="transfer-note">It becomes theirs to change and delete. Everyone it is shared with keeps seeing it.</p>

    <div class="form" *ngIf="loading" aria-busy="true" aria-label="Finding people">
      <span class="sk sk-field"></span>
    </div>

    <ng-container *ngIf="!loading">
      <p class="transfer-empty" *ngIf="!candidates.length">
        Nobody to hand it to: you share no group with another active member.
      </p>
      <ng-container *ngIf="candidates.length">
        <span class="search-field transfer-search">
          <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
          <input class="input" type="search" placeholder="Name or email" aria-label="Find a person" [(ngModel)]="query" />
        </span>
        <app-choice-cards label="Hand over to" [choices]="choices" [(ngModel)]="selectedId"></app-choice-cards>
        <p class="transfer-empty" *ngIf="!visible.length">No one matches.</p>
      </ng-container>
    </ng-container>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button class="btn" type="button" [disabled]="busy" (click)="close()">Cancel</button>
    <button class="btn primary" type="button" [disabled]="busy || !selected" (click)="confirm()">
      {{ busy ? "Handing over…" : selected ? "Hand over to " + (selected.user_name || selected.email) : "Hand over" }}
    </button>
  </mat-dialog-actions>
</ng-template>
