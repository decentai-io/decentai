<app-page title="Organization" sentence="The boundary everything else lives inside: its people, groups, roles, policies and data.">
  <div class="form" *ngIf="loading" aria-busy="true" aria-label="Reading the organization">
    <span class="sk sk-field"></span>
  </div>

  <form class="form" *ngIf="!loading && organization as org" (ngSubmit)="save()">
    <app-field label="Name" help="Shown to everyone in the organization."
               [error]="tried && !name.trim() ? 'Give the organization a name.' : ''">
      <input class="input" name="org-name" autocomplete="organization" [(ngModel)]="name" [readOnly]="!canRename" />
    </app-field>
    <p class="form-section-note admin-fact" *ngIf="created">Created {{ created }}.</p>

    <app-save-bar *ngIf="canRename" [dirty]="dirty" [saving]="saving" [error]="saveError"
                  (save)="save()" (discard)="name = org.org_name"></app-save-bar>
  </form>
</app-page>
