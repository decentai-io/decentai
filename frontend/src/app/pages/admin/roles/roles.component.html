<app-page guide="access#groups-roles-policies" title="Roles" sentence="A role is a bundle of policies. Attach it to a group, and everyone in the group gets what its policies grant." [wide]="true">
  <p class="form-notice is-error" role="alert" *ngIf="error && !editing">{{ error }}</p>
  <p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>

  <app-list label="Roles" [loading]="loading">
    <ng-container listToolbar *ngIf="roles.length">
      <span class="search-field toolbar-search">
        <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
        <input class="input" type="search" placeholder="Search roles" aria-label="Search roles" [(ngModel)]="query" />
      </span>
      <ng-container *ngTemplateOutlet="addButton"></ng-container>
    </ng-container>

    <app-row *ngFor="let role of shown">
      <lucide-icon rowMark name="shield-check" [size]="20" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
      <button rowName class="admin-name" type="button" *ngIf="canUpdate || canAssign; else plainName" (click)="startEdit(role)">{{ role.role_name }}</button>
      <ng-template #plainName><span rowName>{{ role.role_name }}</span></ng-template>
      <ng-container rowMeta>
        <span *ngIf="role.description">{{ role.description }} · </span>{{ summarise(role) }}
      </ng-container>
      <button rowState class="icon-btn sm" type="button" *ngIf="canUpdate || canAssign || canDelete"
              [attr.aria-label]="'More for ' + role.role_name" [disabled]="isBusy(role.role_id)"
              [matMenuTriggerFor]="roleMenu" [matMenuTriggerData]="{ role: role }">
        <lucide-icon name="ellipsis-vertical" [size]="16" aria-hidden="true"></lucide-icon>
      </button>
    </app-row>

    <app-empty *ngIf="!loading && !roles.length" icon="shield-check" title="No roles yet"
               line="A role bundles policies, so a group can be given them in one piece.">
      <ng-container *ngTemplateOutlet="addButton"></ng-container>
    </app-empty>
    <app-empty *ngIf="roles.length && !shown.length" icon="search-x" title="No role matches" line="Try another search."></app-empty>
  </app-list>

  <ng-template #addButton>
    <button class="btn primary toolbar-end" type="button" *ngIf="canCreate" (click)="startCreate()">
      <lucide-icon name="plus" [size]="16" aria-hidden="true"></lucide-icon>
      New role
    </button>
  </ng-template>

  <mat-menu #roleMenu="matMenu" xPosition="before">
    <ng-template matMenuContent let-role="role">
      <button mat-menu-item *ngIf="canUpdate || canAssign" (click)="startEdit(role)">Edit</button>
      <button mat-menu-item *ngIf="canDelete" (click)="remove(role)">Delete</button>
    </ng-template>
  </mat-menu>

  <!-- ── A role, made or changed ─────────────────────────────────────── -->
  <ng-template #editor>
    <h2 mat-dialog-title>{{ editorTitle }}</h2>
    <form (ngSubmit)="save()">
      <mat-dialog-content>
        <div class="form">
          <app-field label="Name" [error]="tried && !formName.trim() ? 'Give the role a name.' : ''">
            <input class="input" name="role-name" autocomplete="off" placeholder="Data steward"
                   [(ngModel)]="formName" [disabled]="!isCreating && !canUpdate" />
          </app-field>
          <app-field label="Description (optional)" help="What the role is for.">
            <input class="input" name="role-description" autocomplete="off"
                   [(ngModel)]="formDescription" [disabled]="!isCreating && !canUpdate" />
          </app-field>

          <fieldset class="admin-picks">
            <legend>Policies<span class="admin-count">{{ selected.size }} of {{ policies.length }}</span></legend>
            <mat-checkbox class="check-row" *ngFor="let policy of policies" [checked]="isPolicyOn(policy.policy_id)"
                          [disabled]="!canAssign" (change)="togglePolicy(policy.policy_id)">
              <span class="check-name">{{ policy.name }}</span>
              <span class="check-hint" *ngIf="policy.description">{{ policy.description }}</span>
            </mat-checkbox>
          </fieldset>
          <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
        </div>
      </mat-dialog-content>
      <mat-dialog-actions>
        <button class="btn" type="button" [disabled]="saving" (click)="cancelEdit()">Cancel</button>
        <button class="btn primary" type="submit" [disabled]="saving">
          {{ saving ? "Saving…" : isCreating ? "Create role" : "Save changes" }}
        </button>
      </mat-dialog-actions>
    </form>
  </ng-template>
</app-page>
