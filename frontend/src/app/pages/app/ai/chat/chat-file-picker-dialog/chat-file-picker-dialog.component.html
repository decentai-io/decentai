<h2 mat-dialog-title>Choose from your files</h2>

<mat-dialog-content>
  <p class="dialog-note">
    Files you uploaded, attached in other chats, or an agent produced. What you choose is
    attached to this message by reference: nothing is copied.
  </p>
  <app-file-picker [recentCount]="8" (selectionChange)="chosen = $event"></app-file-picker>
</mat-dialog-content>

<mat-dialog-actions>
  <button class="btn" type="button" (click)="close()">Cancel</button>
  <button class="btn primary" type="button" [disabled]="!chosen.length" (click)="attach()">
    {{ chosen.length <= 1 ? 'Attach' : 'Attach ' + chosen.length + ' files' }}
  </button>
</mat-dialog-actions>
