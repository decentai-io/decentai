<app-page guide="audit" title="Audit" sentence="A permanent record of changes, access, approvals and agent activity." [wide]="true">
  <app-segmented
    pageActions
    *ngIf="canSeeOrg"
    label="Whose record"
    [choices]="tabs"
    [ngModel]="tab"
    (ngModelChange)="selectTab($event)"
  ></app-segmented>

  <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>

  <app-list rows="groups" label="the record" [loading]="loading">
    <form listToolbar class="audit-filters" (ngSubmit)="reload()">
      <span class="search-field toolbar-search">
        <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
        <input
          class="input"
          type="search"
          name="text"
          placeholder="Action, agent, endpoint or person"
          aria-label="Search the record"
          [(ngModel)]="text"
        />
      </span>
      <app-select class="toolbar-sort" label="Kind of event" name="type" [choices]="types" [(ngModel)]="type"></app-select>
      <label class="toolbar-date">
        From
        <input class="input" type="date" name="since" [(ngModel)]="since" />
      </label>
      <label class="toolbar-date">
        To
        <input class="input" type="date" name="until" [(ngModel)]="until" />
      </label>
      <button class="btn" type="submit" [disabled]="loading">Apply</button>
      <button class="btn ghost" type="button" *ngIf="filtered" [disabled]="loading" (click)="clearFilters()">Clear</button>
    </form>

    <app-empty
      *ngIf="!days.length"
      icon="scroll-text"
      [title]="filtered ? 'Nothing matches those filters' : 'Nothing recorded yet'"
      [line]="filtered ? 'Widen the dates or clear the search.' : 'Platform changes and agent activity appear here as they happen.'"
    ></app-empty>

    <section *ngFor="let day of days">
      <h2 class="record-day">{{ day.day }}</h2>
      <div role="list" [attr.aria-label]="day.day">
        <app-record-row
          *ngFor="let group of day.items"
          [time]="time(group.first)"
          [tone]="tone(group.first)"
          [outcome]="outcome(group.first)"
          [words]="words(group.first)"
          [more]="more(group.first)"
          [chip]="kind(group.first)"
          [count]="group.events.length"
          [canOpen]="group.events.length > 1 || hasDetails(group.first)"
          [open]="isOpen(groupKey(group))"
          (toggle)="toggle(groupKey(group))"
        >
          <span recordEnd class="audit-who" *ngIf="tab === 'org' && group.first.actor">{{ group.first.actor }}</span>
          <span recordEnd class="audit-chat">
            <a
              class="icon-btn sm"
              *ngIf="group.first.chat_id"
              aria-label="Open the chat"
              matTooltip="Open the chat"
              [routerLink]="['/ai/chats', group.first.chat_id]"
            >
              <lucide-icon name="message-square-text" [size]="16" aria-hidden="true"></lucide-icon>
            </a>
          </span>

          <ng-container *ngIf="isOpen(groupKey(group))">
            <ng-container *ngIf="group.events.length === 1">
              <ng-container *ngTemplateOutlet="written; context: { $implicit: group.first }"></ng-container>
            </ng-container>

            <!-- Several alike: each of them, with its own time and details. -->
            <div role="list" *ngIf="group.events.length > 1" [attr.aria-label]="words(group.first)">
              <app-record-row
                *ngFor="let event of group.events"
                [time]="time(event)"
                [tone]="tone(event)"
                [outcome]="outcome(event)"
                [words]="words(event)"
                [more]="more(event)"
                [canOpen]="hasDetails(event)"
                [open]="isOpen(event.event_id)"
                (toggle)="toggle(event.event_id)"
              >
                <ng-container *ngIf="isOpen(event.event_id)">
                  <ng-container *ngTemplateOutlet="written; context: { $implicit: event }"></ng-container>
                </ng-container>
              </app-record-row>
            </div>
          </ng-container>
        </app-record-row>
      </div>
    </section>

    <div class="record-older" *ngIf="nextBefore">
      <button class="btn" type="button" [disabled]="loadingMore" (click)="loadMore()">
        {{ loadingMore ? "Loading…" : "Load older" }}
      </button>
    </div>
  </app-list>
</app-page>

<!-- One event as it was written down: who did it, what it names, its details, its id. -->
<ng-template #written let-event>
  <div class="audit-refs" *ngIf="event.actor">By {{ event.actor }}</div>
  <div class="audit-refs" *ngIf="event.resource_refs?.length">
    References
    <code *ngFor="let ref of event.resource_refs">{{ ref }}</code>
  </div>
  <pre class="record-json">{{ details(event) }}</pre>
  <span class="audit-id">{{ event.event_id }}</span>
</ng-template>
