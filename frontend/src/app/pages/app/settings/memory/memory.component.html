<app-empty *ngIf="loadError" icon="cloud-off" title="Memory could not be loaded" [line]="loadError">
  <button class="btn" type="button" (click)="load()">Try again</button>
</app-empty>

<ng-container *ngIf="!loadError">
  <!-- Writing one yourself: always here, so the page says what a memory is
       by showing where one goes. -->
  <form class="memory-add" *ngIf="canAdd && !loading" (ngSubmit)="addMemory()">
    <app-field
      label="Add a memory"
      help="One lasting fact that stands on its own: a preference, your role, how you like things done."
      [error]="addError"
    >
      <textarea
        class="input"
        name="new-memory"
        rows="2"
        placeholder="I prefer concise status updates with the risks first."
        [maxlength]="textLimit"
        [(ngModel)]="newText"
      ></textarea>
    </app-field>
    <div class="memory-add-foot">
      <span class="memory-counter">{{ newText.length }}/{{ textLimit }}</span>
      <button class="btn primary" type="submit" [disabled]="!canSubmitNew">
        {{ adding ? "Adding…" : "Add" }}
      </button>
    </div>
  </form>

  <app-list label="Memories" [loading]="loading" [foot]="memories.length ? foot : ''">
    <ng-container listToolbar *ngIf="memories.length">
      <span class="search-field toolbar-search">
        <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
        <input class="input" type="search" placeholder="Search memory" aria-label="Search memory" [(ngModel)]="query" />
      </span>
      <!-- The cap is not decoration: at the limit the oldest is dropped
           to make room, and a page that promises control owes that in
           advance. -->
      <span class="chip warn" *ngIf="nearLimit" role="status">{{ capWarning }}</span>
    </ng-container>

    <ng-container *ngFor="let memory of filteredMemories">
      <app-row *ngIf="editingId !== memory.memory_id">
        <span rowName class="memory-text">{{ memory.text }}</span>
        <!-- Whose words these are comes first; the conversation that
             started it is a link beside that, not a claim about it. -->
        <ng-container rowMeta>
          <span [title]="originInFull(memory)">{{ originLabel(memory) }}</span>
          <ng-container *ngIf="memory.source_chat_id">
            · {{ memory.corrected ? "first saved" : "" }}
            <a [routerLink]="['/ai/chats', memory.source_chat_id]">in a chat</a>
          </ng-container>
        </ng-container>
        <button
          rowActions
          class="icon-btn sm"
          type="button"
          *ngIf="canEdit"
          aria-label="Edit this memory"
          matTooltip="Edit"
          [disabled]="!!busyId || editingId !== null"
          (click)="startEdit(memory)"
        >
          <lucide-icon name="pencil" [size]="16" aria-hidden="true"></lucide-icon>
        </button>
        <button
          rowActions
          class="icon-btn sm danger"
          type="button"
          *ngIf="canForget"
          aria-label="Forget this memory"
          matTooltip="Forget"
          [disabled]="!!busyId"
          (click)="forget(memory)"
        >
          <lucide-icon name="trash-2" [size]="16" aria-hidden="true"></lucide-icon>
        </button>
      </app-row>

      <!-- Editing: the row becomes the field. -->
      <app-row *ngIf="editingId === memory.memory_id">
      <form class="memory-edit" (ngSubmit)="saveEdit(memory)">
        <app-field label="Edit this memory" [error]="editError">
          <textarea class="input" name="edit-memory" rows="3" [maxlength]="textLimit" [(ngModel)]="editText"></textarea>
        </app-field>
        <div class="memory-add-foot">
          <span class="memory-counter">{{ editText.length }}/{{ textLimit }}</span>
          <button class="btn" type="button" [disabled]="busyId === memory.memory_id" (click)="cancelEdit()">Cancel</button>
          <button
            class="btn primary"
            type="submit"
            [disabled]="busyId === memory.memory_id || !editText.trim() || editText.trim() === memory.text"
          >
            {{ busyId === memory.memory_id ? "Saving…" : "Save" }}
          </button>
        </div>
      </form>
      </app-row>
    </ng-container>

    <app-empty
      *ngIf="!memories.length"
      icon="lightbulb"
      title="Nothing remembered yet"
      line="Add a memory above, or ask the assistant to remember something during a chat."
    ></app-empty>
    <app-empty
      *ngIf="memories.length && !filteredMemories.length"
      icon="search-x"
      title="No memory matches"
      line="Try another search."
    ></app-empty>
  </app-list>

  <div class="memory-foot" *ngIf="memories.length && canForget && !loading">
    <button class="btn danger sm" type="button" [disabled]="forgettingAll || !!busyId" (click)="forgetAll()">
      {{ forgettingAll ? "Forgetting…" : "Forget all" }}
    </button>
    <span class="memory-error" role="alert" *ngIf="forgetError">{{ forgetError }}</span>
  </div>
</ng-container>
