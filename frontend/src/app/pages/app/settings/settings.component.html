<!-- Settings › Model providers, inside the shell, which shows its title. -->
<div class="data-alert error" *ngIf="error">{{ error }}</div>
<div class="data-alert ok" *ngIf="notice">{{ notice }}</div>

<div class="data-loading" *ngIf="loading">
  <span class="ui-spinner" role="status" aria-label="Loading"></span>
  <span>Loading providers…</span>
</div>

<app-model-providers
  *ngIf="!loading"
  [connections]="managed"
  [providers]="providers"
  [profile]="profile"
  [peers]="peers"
  (changed)="reload()"
></app-model-providers>
