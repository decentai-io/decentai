<app-page
  title="Secrets"
  sentence="What you store for your agents to act with. The values are encrypted, and never shown back."
  [wide]="true"
>
  <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
  <p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>

  <div class="side-layout" [class.has-opened]="opened">
    <app-filter-column
      *ngIf="secrets.length && !opened"
      label="Filter secrets"
      [groups]="filters"
      [chosen]="chosen"
      (choose)="filter($event.key, $event.value)"
    ></app-filter-column>

    <app-list label="Secrets" [loading]="loading" [class.side-alone]="!secrets.length">
      <ng-container listToolbar *ngIf="secrets.length">
        <span class="search-field toolbar-search">
          <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
          <input class="input" type="search" placeholder="Search secrets" aria-label="Search secrets"
                 [ngModel]="query" (ngModelChange)="go({ q: $event })" />
        </span>
        <ng-container *ngTemplateOutlet="addButton"></ng-container>
      </ng-container>

      <app-row *ngFor="let secret of shownSecrets" [class.is-current]="secret.resource_ref === openRef">
        <!-- The mark of the agent that uses it; a globe for a login, a
             key for one no agent uses. -->
        <ng-container rowMark>
          <app-agent-mark *ngIf="markOf(secret) && !isLogin(secret); else plainMark" [name]="markOf(secret)"></app-agent-mark>
          <ng-template #plainMark>
            <lucide-icon [name]="isLogin(secret) ? 'globe' : 'key-round'" [size]="20" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
          </ng-template>
        </ng-container>
        <a rowName class="secret-row-name" [routerLink]="['/secrets', secret.resource_ref]" queryParamsHandling="preserve"
           [attr.aria-current]="secret.resource_ref === openRef ? 'true' : null">{{ titleOf(secret) }}</a>
        <span rowChips class="chip warn" *ngIf="outdated(secret)" matTooltip="The agent's shape for it has a newer version">Outdated</span>
        <span rowChips class="chip warn" *ngIf="needsReconnect(secret)" matTooltip="The provider no longer accepts this account's grant">Needs reconnect</span>
        <ng-container rowMeta>
          <span class="secret-row-facts">
            <span>{{ kindOf(secret) }}</span>
            <span *ngIf="identifierOf(secret)">{{ identifierOf(secret) }}</span>
          </span>
          <span class="secret-row-facts">
            <span *ngIf="usedBy(secret)">{{ usedBy(secret) }}</span>
            <span *ngIf="updated(secret)" [matTooltip]="updatedInFull(secret)">updated {{ updated(secret) }}</span>
            <span class="chip" [matTooltip]="sharing(secret).names">{{ sharing(secret).word }}</span>
          </span>
        </ng-container>

        <button rowState class="icon-btn sm" type="button" *ngIf="mayChange(secret)"
                [attr.aria-label]="'More for ' + titleOf(secret)" [matMenuTriggerFor]="secretMenu"
                [matMenuTriggerData]="{ secret: secret }">
          <lucide-icon name="ellipsis-vertical" [size]="16" aria-hidden="true"></lucide-icon>
        </button>
      </app-row>

      <app-empty
        *ngIf="!loading && !secrets.length"
        icon="key-round"
        title="No secrets yet"
        line="A secret is what an agent needs to act for you: an account it signs in to, a token for a service. It is stored encrypted, used only by the agents you allow, and never shown back."
      >
        <ng-container *ngTemplateOutlet="addButton"></ng-container>
      </app-empty>
      <app-empty
        *ngIf="secrets.length && !shownSecrets.length"
        icon="search-x"
        [title]="filtered ? 'No secret matches' : show === 'mine' ? 'None of these are yours' : 'Nothing is shared with you'"
        [line]="filtered ? 'Try another search, or clear the filters.' : ''"
      >
        <button class="btn" type="button" *ngIf="filtered" (click)="go({ q: '', agent: '', site: '' })">Clear the filters</button>
      </app-empty>
    </app-list>

    <!-- The secret the address names: beside the list on a wide screen,
         in its place on a narrow one. -->
    <app-secret-view
      class="side-opened"
      *ngIf="opened as secret"
      [secret]="secret"
      [definitions]="definitions"
      [sharing]="sharing(secret).word"
      [mine]="mayChange(secret)"
      [canUpdate]="canUpdate"
      [canDelete]="canDelete"
      [busy]="busyRef === secret.resource_ref"
      (closed)="closeOpened()"
      (edit)="edit(secret)"
      (lend)="lend(secret)"
      (takeBack)="takeBack(secret, $event)"
      (revokeConsent)="revokeConsent(secret, $event)"
      (reconnect)="reconnect(secret)"
      (share)="openShare(secret)"
      (handOver)="requestTransfer(secret)"
      (remove)="askDelete(secret)"
    ></app-secret-view>
  </div>

  <ng-template #addButton>
    <button class="btn primary toolbar-end" type="button" *ngIf="canCreate" (click)="add()">
      <lucide-icon name="plus" [size]="16" aria-hidden="true"></lucide-icon>
      Add a secret
    </button>
  </ng-template>

  <mat-menu #secretMenu="matMenu" xPosition="before">
    <ng-template matMenuContent let-secret="secret">
      <a mat-menu-item [routerLink]="['/secrets', secret.resource_ref]" queryParamsHandling="preserve">Open</a>
      <button mat-menu-item *ngIf="canUpdate && !isLogin(secret)" (click)="edit(secret)">{{ outdated(secret) ? "Update" : "Edit" }}</button>
      <button mat-menu-item *ngIf="!isLogin(secret)" (click)="lend(secret)">Lend to an agent…</button>
      <button mat-menu-item *ngIf="isOauth(secret)" [disabled]="busyRef === secret.resource_ref" (click)="reconnect(secret)">Reconnect</button>
      <button mat-menu-item *ngIf="canUpdate" (click)="openShare(secret)">Share</button>
      <button mat-menu-item (click)="requestTransfer(secret)">Hand over</button>
      <button mat-menu-item *ngIf="canDelete" [disabled]="busyRef === secret.resource_ref" (click)="askDelete(secret)">Delete</button>
    </ng-template>
  </mat-menu>

  <app-share-dialog *ngIf="share.ref"
                    [share]="share"
                    heading="Who can see this secret"
                    note="The people you share with can let their own agents use it. Its values are still never shown to anyone."
                    [allowOrganization]="canShareAny"
                    [problem]="shareProblem"
                    (save)="saveShare()" (closed)="share.close()">
  </app-share-dialog>

  <app-transfer-dialog *ngIf="transferTarget as item"
                       [subject]="'the secret “' + item.name + '”'" [ownerId]="item.created_by"
                       [busy]="transferring" (chosen)="transfer($event)" (closed)="closeTransfer()">
  </app-transfer-dialog>
</app-page>
