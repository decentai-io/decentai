<!-- One agent, on its own address (/agents/<ref>): its page takes the
     list's place. -->
<ng-container *ngIf="openAgent">
  <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
  <p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>
<app-agent-detail *ngIf="openAgent as agent"
                  [agent]="agent"
                  [tab]="openTab"
                  (tabChange)="openTabOf($event)"
                  [credentials]="openCredentials"
                  [groups]="groups"
                  [myGroups]="myGroups"
                  [canShareAny]="canShareAny"
                  [myUserId]="myUserId"
                  [secretDefaults]="secretDefaults"
                  [canInstall]="canInstall"
                  [canUninstall]="canUninstall"
                  [busyId]="busyId"
                  (back)="closeDetail()"
                  (update)="update($event)"
                  (uninstall)="requestUninstall($event)"
                  (credentialsChanged)="onCredentialsChanged()"
                  (failed)="error = $event"
                  (flashed)="notice = $event"></app-agent-detail>
</ng-container>

<app-page
  *ngIf="!openAgent"
  title="Agents"
  sentence="What this organization approved. Open one to manage its credentials, functions and access."
  [wide]="true"
>
  <!-- Only for whoever may install: the marketplace refuses anyone else. -->
  <a pageActions class="btn primary" routerLink="/agents/marketplace" *ngIf="canInstall">
    <lucide-icon name="store" [size]="16" aria-hidden="true"></lucide-icon>
    Marketplace
  </a>

  <p class="form-notice is-error" role="alert" *ngIf="error">{{ error }}</p>
  <p class="form-notice" role="status" *ngIf="notice">{{ notice }}</p>

  <app-list label="agents" rows="groups" [loading]="loading" [foot]="foot">
    <ng-container listToolbar *ngIf="agents.length">
      <!-- With something ticked, the toolbar is what can be done to it. -->
      <app-selection-bar
        class="toolbar-fill"
        *ngIf="selected.size; else toolbar"
        [count]="selected.size"
        [shown]="selectableShown.length"
        (selectAll)="selectAllShown()"
        (clear)="clearSelection()"
      >
        <button class="btn danger sm" type="button" [disabled]="uninstallBusy" (click)="requestUninstallSelected()">
          <lucide-icon name="trash-2" [size]="16" aria-hidden="true"></lucide-icon>
          Uninstall
        </button>
      </app-selection-bar>

      <ng-template #toolbar>
        <app-segmented label="Which agents" [choices]="filters" [ngModel]="filter" (ngModelChange)="setFilter($event)"></app-segmented>
        <span class="search-field toolbar-search toolbar-end">
          <lucide-icon name="search" [size]="16" aria-hidden="true"></lucide-icon>
          <input
            class="input"
            type="search"
            placeholder="Search agents"
            aria-label="Search installed agents"
            [ngModel]="query"
            (ngModelChange)="search($event)"
          />
        </span>
      </ng-template>
    </ng-container>

    <div class="agent-grid" *ngIf="pagedAgents.length">
      <app-agent-card
        *ngFor="let agent of pagedAgents"
        [name]="agent.name || agent.agent_id"
        [icon]="agent.icon"
        [version]="version(agent)"
        [chip]="standing(agent)"
        [description]="agent.description"
        [facts]="facts(agent)"
        [problems]="agent.prepared?.state === 'failed' && agent.prepared?.error ? [agent.prepared!.error!] : []"
        [link]="['/agents', agent.agent_id]"
        [selectable]="selectable(agent)"
        [selected]="isSelected(agent)"
        [selecting]="selected.size > 0"
        (selectedChange)="toggleSelected(agent)"
      >
        <!-- The card's own decisions: whether new chats start with
             it, and what else can be done to it. -->
        <app-switch
          cardFoot
          label="In new chats"
          [disabled]="!!savingDefaultFor"
          [ngModel]="isDefault(agent)"
          (ngModelChange)="toggleDefault(agent)"
        ></app-switch>
        <button
          cardFoot
          class="icon-btn sm"
          type="button"
          [attr.aria-label]="'More for ' + (agent.name || agent.agent_id)"
          [matMenuTriggerFor]="cardMenu"
          [matMenuTriggerData]="{ agent: agent }"
        >
          <lucide-icon name="ellipsis-vertical" [size]="16" aria-hidden="true"></lucide-icon>
        </button>
      </app-agent-card>
    </div>

    <mat-menu #cardMenu="matMenu" xPosition="before">
      <ng-template matMenuContent let-agent="agent">
        <a mat-menu-item [routerLink]="['/agents', agent.agent_id]">
          <lucide-icon name="arrow-right" [size]="16" aria-hidden="true"></lucide-icon>
          <span>Open</span>
        </a>
        <button mat-menu-item *ngIf="canInstall && agent.status === 'update_available'" (click)="update(agent)">
          <lucide-icon name="refresh-cw" [size]="16" aria-hidden="true"></lucide-icon>
          <span>Review update</span>
        </button>
        <button mat-menu-item *ngIf="canUninstall" (click)="requestUninstall(agent)">
          <lucide-icon name="trash-2" [size]="16" aria-hidden="true"></lucide-icon>
          <span>Uninstall</span>
        </button>
      </ng-template>
    </mat-menu>

    <app-pager [page]="page" [pageSize]="pageSize" [total]="shownAgents.length" (pageChange)="page = $event"></app-pager>

    <app-empty
      *ngIf="!agents.length"
      icon="bot"
      title="No agents installed"
      line="An agent is code this organization approved and can run. Chats work without them: they are how the assistant does something in a system of yours rather than only talking about it."
    >
      <a class="btn primary" routerLink="/agents/marketplace" *ngIf="canInstall">Open the Marketplace</a>
    </app-empty>
    <app-empty
      *ngIf="agents.length && !shownAgents.length"
      icon="search-x"
      title="No agent matches"
      line="Try another search, or show all of them."
    >
      <button class="btn" type="button" (click)="search(''); setFilter('all')">Show all</button>
    </app-empty>
  </app-list>
</app-page>
