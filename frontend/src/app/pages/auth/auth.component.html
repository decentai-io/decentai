<app-entry-card [title]="title" [sentence]="subtitle" [busy]="mode === 'entering' || checkingInvite || checkingReset">

  <!-- ── Sign in ────────────────────────────────────────────────── -->
  <form class="form" *ngIf="mode === 'login'" (ngSubmit)="signIn()">
    <app-field label="Email" [error]="tried ? emailProblem : ''">
      <input class="input" type="email" name="email" autocomplete="username" autofocus
             [(ngModel)]="email" [disabled]="busy" />
    </app-field>
    <app-field label="Password" [error]="tried && !password ? 'Enter your password.' : ''">
      <ng-container *ngTemplateOutlet="passwordBox; context: { autocomplete: 'current-password' }"></ng-container>
    </app-field>
    <mat-checkbox class="check-row" name="remember" [(ngModel)]="remember" [disabled]="busy">
      <span class="check-name">Keep me signed in on this device</span>
      <span class="check-hint">Until you sign out. Leave it off on a shared computer.</span>
    </mat-checkbox>

    <ng-container *ngTemplateOutlet="refusal"></ng-container>
    <button class="btn primary auth-wide" type="submit" [disabled]="busy || lockedFor > 0">{{ busy ? "Signing in…" : "Sign in" }}</button>
    <button class="auth-link" type="button" (click)="startForgot()">Forgot your password?</button>
    <p class="auth-foot">No account? Ask an administrator for an invitation.</p>
  </form>

  <!-- ── Accept an invitation ───────────────────────────────────── -->
  <ng-container *ngIf="mode === 'invitation' && !checkingInvite">
    <form class="form" *ngIf="inviteValid" (ngSubmit)="acceptInvitation()">
      <ng-container *ngTemplateOutlet="fixedEmail"></ng-container>
      <app-field label="Your name" [error]="tried && !name.trim() ? 'Enter your name.' : ''">
        <input class="input" type="text" name="name" autocomplete="name" autofocus [(ngModel)]="name" [disabled]="busy" />
      </app-field>
      <ng-container *ngTemplateOutlet="newPassword; context: { label: 'Choose a password' }"></ng-container>
      <ng-container *ngTemplateOutlet="refusal"></ng-container>
      <button class="btn primary auth-wide" type="submit" [disabled]="busy">{{ busy ? "Joining…" : "Join " + orgName }}</button>
      <p class="auth-foot">Not you? <button class="auth-link" type="button" (click)="dismissInvitation()">Sign in instead</button></p>
    </form>
    <ng-container *ngIf="!inviteValid">
      <button class="btn primary auth-wide" type="button" (click)="dismissInvitation()">Go to sign in</button>
    </ng-container>
  </ng-container>

  <!-- ── Replace a password that was handed over ────────────────── -->
  <form class="form" *ngIf="mode === 'first'" (ngSubmit)="chooseOwnPassword()">
    <ng-container *ngTemplateOutlet="fixedEmail"></ng-container>
    <ng-container *ngTemplateOutlet="newPassword; context: { label: 'New password' }"></ng-container>
    <ng-container *ngTemplateOutlet="refusal"></ng-container>
    <button class="btn primary auth-wide" type="submit" [disabled]="busy">{{ busy ? "Saving…" : "Save and sign in" }}</button>
    <button class="auth-link" type="button" (click)="backToLogin()">Back to sign in</button>
  </form>

  <!-- ── Ask for a reset link ───────────────────────────────────── -->
  <ng-container *ngIf="mode === 'forgot'">
    <form class="form" *ngIf="!forgotMessage" (ngSubmit)="requestReset()">
      <app-field label="Email" [error]="tried ? emailProblem : ''">
        <input class="input" type="email" name="email" autocomplete="username" autofocus
               [(ngModel)]="email" [disabled]="busy" />
      </app-field>
      <ng-container *ngTemplateOutlet="refusal"></ng-container>
      <button class="btn primary auth-wide" type="submit" [disabled]="busy">{{ busy ? "Sending…" : "Email me a link" }}</button>
      <button class="auth-link" type="button" (click)="backToLogin()">Back to sign in</button>
    </form>
    <!-- What happened is the title and the sentence above. -->
    <button class="btn primary auth-wide" type="button" *ngIf="forgotMessage" (click)="backToLogin()">Back to sign in</button>
  </ng-container>

  <!-- ── Set a new password from a link ─────────────────────────── -->
  <ng-container *ngIf="mode === 'reset' && !checkingReset">
    <form class="form" *ngIf="resetValid" (ngSubmit)="setNewPassword()">
      <ng-container *ngTemplateOutlet="fixedEmail"></ng-container>
      <ng-container *ngTemplateOutlet="newPassword; context: { label: 'New password', also: 'This signs you out everywhere else.' }"></ng-container>
      <ng-container *ngTemplateOutlet="refusal"></ng-container>
      <button class="btn primary auth-wide" type="submit" [disabled]="busy">{{ busy ? "Saving…" : "Set password and sign in" }}</button>
      <p class="auth-foot">Remembered it? <button class="auth-link" type="button" (click)="backToLogin()">Sign in instead</button></p>
    </form>
    <button class="btn primary auth-wide" type="button" *ngIf="!resetValid" (click)="backToLogin()">Back to sign in</button>
  </ng-container>
</app-entry-card>

<!-- A password box, with the eye that shows what was typed. -->
<ng-template #passwordBox let-autocomplete="autocomplete">
  <span class="auth-password">
    <input class="input" name="password" [type]="shown ? 'text' : 'password'" [autocomplete]="autocomplete"
           [(ngModel)]="password" [disabled]="busy" />
    <button class="icon-btn sm" type="button" [attr.aria-pressed]="shown"
            [attr.aria-label]="shown ? 'Hide the password' : 'Show the password'" (click)="shown = !shown">
      <lucide-icon [name]="shown ? 'eye-off' : 'eye'" [size]="16" aria-hidden="true"></lucide-icon>
    </button>
  </span>
</ng-template>

<!-- A password being chosen: the rule under it, each part ticked as it
     is met, checked here before the server is asked. -->
<ng-template #newPassword let-label="label" let-also="also">
  <app-field [label]="label" [help]="also || ''" [error]="tried && passwordProblem ? passwordProblem : ''">
    <ng-container *ngTemplateOutlet="passwordBox; context: { autocomplete: 'new-password' }"></ng-container>
  </app-field>
  <ul class="auth-rule" aria-label="What a password needs">
    <li *ngFor="let part of passwordRule" [class.is-met]="part.met">
      <lucide-icon [name]="part.met ? 'check' : 'circle'" [size]="14" aria-hidden="true"></lucide-icon>
      {{ part.words }}<span class="visually-hidden">{{ part.met ? ": met" : ": not yet" }}</span>
    </li>
  </ul>
</ng-template>

<!-- The address is fixed by the link, not chosen here: a password
     manager still files the new password under it. -->
<ng-template #fixedEmail>
  <input class="visually-hidden" type="email" name="email" autocomplete="username" readonly tabindex="-1" aria-hidden="true" [value]="email" />
</ng-template>

<!-- What the server refused, in one block above the button; a lockout
     is told apart from a wrong password. -->
<ng-template #refusal>
  <p class="form-notice" [class.is-warn]="throttled" [class.is-error]="!throttled" role="alert" *ngIf="error">
    <ng-container *ngIf="lockedFor > 0; else said">Too many attempts. Try again in <span class="auth-count">{{ lockLeft }}</span>.</ng-container>
    <ng-template #said>{{ error }}</ng-template>
  </p>
</ng-template>
