<div class="nf">
  <div class="nf-badge" aria-hidden="true">
    <lucide-icon name="globe" [size]="16" [strokeWidth]="1.75"></lucide-icon>
  </div>

  <p class="nf-code">404</p>
  <h1 class="nf-title">Page not found</h1>
  <p class="nf-text">
    The page you're looking for doesn't exist or may have moved.
  </p>

  <button type="button" class="nf-button" (click)="goHome()">
    <lucide-icon aria-hidden="true" name="arrow-left" [size]="16" [strokeWidth]="1.75"></lucide-icon>
    <span>Back to the app</span>
  </button>
</div>
