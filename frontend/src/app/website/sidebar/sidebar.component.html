<aside class="drawer" [class.is-rail]="rail" aria-label="DecentAI navigation">
  <div class="drawer__brand">
    <!-- One brand: the serif word, or its first letter on the rail. -->
    <span class="brand-title" [attr.aria-label]="rail ? 'DecentAI' : null">{{ rail ? "D" : "DecentAI" }}</span>
    <button
      type="button"
      class="drawer-collapse"
      (click)="collapseClicked.emit()"
      [attr.aria-label]="rail ? 'Expand sidebar' : 'Collapse sidebar'"
      [matTooltip]="rail ? 'Expand sidebar' : ''"
      matTooltipPosition="right"
    >
      <lucide-icon [name]="rail ? 'chevrons-right' : 'chevrons-left'" [size]="15" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  <nav class="drawer__nav" aria-label="Workspace">
    <ng-container *ngFor="let section of sections">
      <section class="nav-section" *ngIf="pagesOf(section) as pages" [hidden]="!pages.length">
        <!-- A heading names its group and does nothing else. -->
        <h2 class="section-title">{{ section.name }}</h2>
        <ul class="nav-list">
          <li *ngFor="let page of pages">
            <ng-container *ngTemplateOutlet="link; context: { page: page }"></ng-container>
          </li>
        </ul>
      </section>
    </ng-container>
  </nav>

  <div class="drawer__footer">
    <ng-container *ngFor="let page of footerPages">
      <ng-container *ngTemplateOutlet="link; context: { page: page }"></ng-container>
    </ng-container>
    <button
      type="button"
      class="nav-link is-leaving"
      (click)="signOutClicked.emit()"
      [attr.aria-label]="rail ? 'Sign out' : null"
      [matTooltip]="rail ? 'Sign out' : ''"
      matTooltipPosition="right"
    >
      <lucide-icon class="nav-icon" name="log-out" [size]="17" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
      <span class="nav-label">Sign out</span>
    </button>
  </div>
</aside>

<!-- A page's item: a link, lit on the page and on everything under it. -->
<ng-template #link let-page="page">
  <a
    class="nav-link"
    [routerLink]="'/' + page.url"
    [class.is-active]="isActive(page.url)"
    [attr.aria-current]="isActive(page.url) ? 'page' : null"
    [attr.aria-label]="rail ? page.name : null"
    [matTooltip]="rail ? page.name : ''"
    matTooltipPosition="right"
    (click)="navigationSelected.emit()"
  >
    <lucide-icon class="nav-icon" [name]="page.icon" [size]="17" [strokeWidth]="1.75" aria-hidden="true"></lucide-icon>
    <span class="nav-label">{{ page.name }}</span>
    @if (page.url === 'ai/chats' && (attention.count$ | async); as needing) {
      <span class="nav-badge" [attr.aria-label]="needing + ' chats need you'">{{ needing }}</span>
    }
  </a>
</ng-template>
