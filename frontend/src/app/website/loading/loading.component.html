<div class="loading-page">
  <div class="loading-card">
    <div class="brand-plate">
      <img
        src="assets/brand/logos/decentai-lockup-horizontal.svg"
        alt="DecentAI"
        class="brand-logo brand-logo--light"
      />
      <img
        src="assets/brand/logos/decentai-lockup-horizontal-dark.svg"
        alt="DecentAI"
        class="brand-logo brand-logo--dark"
      />
    </div>

    <div class="loading-status">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" role="status">
        {{ unreachable ? "The server cannot be reached. Trying again…" : "Loading DecentAI…" }}
      </p>
    </div>
    <button class="btn" type="button" *ngIf="unreachable" (click)="retry.emit()">Try now</button>

    <div class="loading-bar" aria-hidden="true">
      <span class="loading-bar__fill"></span>
    </div>
  </div>
</div>
