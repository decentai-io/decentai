# The whole platform on one machine: MongoDB, the one-shot seeder, the
# backend (the Data Core), the AI Runtime, one Execution Sandbox, the
# speech container, and the gateway (Caddy) as the one door: the Data
# Core's paths to the Data Core, and every other to the web client, which
# is a repository of its own (decentai-web-client) and runs beside this
# one. Every setting comes from one file, deploy.env:
#
#   python bootstrap/setup.py      # writes deploy.env, starts this, says where
#
# or, with a deploy.env written by hand from deploy.env.example:
#
#   docker compose --env-file deploy.env up -d --build
#
# As written it serves this computer only, in plain HTTP. A server with
# an address of its own lays docker-compose.server.yml over it
# (docs/run/deploying.md). Only the gateway publishes a port.
#
# Three networks, and who is on which (docs/system/architecture.md):
#
#   default   the one with a way out to the internet: gateway, backend,
#             ai-runtime, speech. The gateway reaches the backend here,
#             and the web client on this computer's port; the
#             backend reaches the speech container, and the internet
#             for repositories, mail and OAuth; the runtime — the
#             bundled execution node — dials the backend's node link
#             and gateway (the backend reaches no node), and the
#             internet for agents' packages and, through its proxy, for
#             agents.
#   data      internal: mongo, and the two that speak to it, backend
#             and init. Nothing else has a route to the database, and
#             the database has none out.
#   agents    internal: ai-runtime and agents, the AI Runtime and its
#             Execution Sandbox. A worker's only way anywhere is the
#             runtime's proxy. A second sandbox, for testing, is laid
#             over this file by docker-compose.sandboxes.yml.
#
# A container on two networks keeps the reach of each: the backend on
# default and data reaches GitHub and the database both; mongo on data
# alone reaches nothing and is reached by two.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in deploy.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in deploy.env}
    networks:
      - data
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot and idempotent: seeds the organization, the access chains,
  # the admin user, and the starter secret definitions, then exits.
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: deploy.env
    command: ["python", "/opt/decentai/bootstrap/init_db.py"]
    restart: "no"
    networks:
      - data
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: deploy.env
    networks:
      - default
      - data
    volumes:
      - uploads_data:/data/uploads
      # Approved agent code, one folder per organization. The only copy
      # the platform controls: a repository can be deleted or
      # force-pushed, this cannot.
      - agent_packages:/data/agent-packages
    # Said here, not left to the image: Podman keeps an image's own
    # health check only for images in Docker's format, and a published
    # image is not in it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # Speech to text and text to speech from models that run here, so a
  # spoken message and a reply said aloud need no provider and leave
  # the machine for nobody (speech/service.py). The image carries the
  # engines and no model: models are fetched once, into the volume,
  # from a pinned list — speech to text as the container first starts,
  # since that is on in a new organization, and the voices when an
  # administrator turns text to speech on. Only the backend asks it.
  speech:
    build:
      context: .
      dockerfile: speech/Dockerfile
    restart: unless-stopped
    environment:
      # What is fetched at start with nobody having asked:
      # "transcription" where this says nothing, nothing where it is
      # empty.
      SPEECH_FETCH:
      # How long a model nobody is using is kept in memory.
      SPEECH_IDLE_SECONDS:
      # A mirror of the models, where the publisher cannot be reached.
      SPEECH_MODEL_HOST:
      LOG_LEVEL:
      TZ:
      # how this machine reaches the internet, and whom it trusts
      HTTP_PROXY:
      HTTPS_PROXY:
      NO_PROXY:
      SSL_CERT_FILE:
    volumes:
      - speech_models:/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The runtime has no database — everything durable goes through the
  # backend's delegation surface.
  #
  # It decides everything about an agent and runs none of their code:
  # its Execution Sandboxes register with it, and it asks one of them
  # to start each worker and speaks to it over that connection
  # (docs/system/sandbox.md). It shares no volume with them: a
  # sandbox is sent the code it is to run, and keeps its own. It is handed its
  # settings by name, never the file: the database's password, the
  # encryption keys and the backend's private key are not this
  # container's to hold. A name with no value is passed on when
  # deploy.env (or the shell) sets it, and is absent when neither does.
  ai-runtime:
    build:
      context: .
      dockerfile: ai_runtime/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - agents
    depends_on:
      agents:
        condition: service_healthy
      node-issuer:
        condition: service_healthy
    # The node's secret, which its Execution Sandboxes prove when they
    # register: in a file of its own (bootstrap/setup.py writes it),
    # given to the AI Runtime and its sandboxes and to nothing else.
    env_file: sandbox.env
    environment:
      AI_RUNTIME_SANDBOX_PORT:
      # Who the Data Core is: nothing it did not sign is believed.
      BACKEND_SERVICE_PUBLIC_KEY: ${BACKEND_SERVICE_PUBLIC_KEY:?set in deploy.env}
      # Who this execution node is: a credential the install's authority
      # signed, which node-issuer writes and keeps fresh. The node reads
      # it and never holds the authority's key.
      AI_RUNTIME_NODE_CREDENTIAL_FILE: /run/decentai/node/credential
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      AI_RUNTIME_AGENTS_INSTALL_DIR: ${AI_RUNTIME_AGENTS_INSTALL_DIR:-/data/agents}
      AI_RUNTIME_HOST:
      AI_RUNTIME_PORT:
      AI_RUNTIME_EGRESS_PORT:
      # where an agent's declared packages come from
      AI_RUNTIME_PACKAGE_HOSTS:
      PIP_INDEX_URL:
      PIP_EXTRA_INDEX_URL:
      PIP_TRUSTED_HOST:
      PIP_CERT:
      LOG_LEVEL:
      TZ:
      # how this machine reaches the internet, and whom it trusts
      HTTP_PROXY:
      HTTPS_PROXY:
      NO_PROXY:
      SSL_CERT_FILE:
      REQUESTS_CA_BUNDLE:
      # the platform's knobs for agents, passed on to their workers
      DECENTAI_WEB_ALLOW_LOOPBACK:
      DECENTAI_BROWSER_MAX:
      DECENTAI_BROWSER_IDLE_SECONDS:
      DECENTAI_BROWSER_HEADLESS:
      DECENTAI_BROWSER_PROMPT_CHARS:
      DECENTAI_BROWSER_FOLD_EVERY:
      DECENTAI_CODE_RUN_SECONDS:
    volumes:
      # the approved packages it passes on to its sandboxes
      - runtime_agents:/data/agents
      - node_credential:/run/decentai/node:ro

  # The install's own issuer of node credentials — what a secret
  # manager or a cluster's workload identity is for a larger deployment
  # (docs/system/execution-nodes.md). It holds the authority's private
  # key, which the seeder registered as a shared authority, signs a
  # credential naming the bundled node that lives ten minutes, and
  # writes it again every few. It reaches no network; the node mounts
  # what it writes read-only.
  node-issuer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "/opt/decentai/bootstrap/node_issuer.py"]
    network_mode: none
    # The install's authority's private key, in a file of its own
    # (bootstrap/setup.py writes it), given to this service alone: the
    # Data Core and the seeder hold only its public half.
    env_file: node-authority.env
    environment:
      NODE_NAME: ${NODE_NAME:-bundled}
      NODE_CREDENTIAL_FILE: /run/decentai/node/credential
      LOG_LEVEL:
    volumes:
      - node_credential:/run/decentai/node
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.isfile('/run/decentai/node/credential') else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # The Execution Sandbox: agent code runs here, and nothing else does.
  # The runtime's image, started as the spawner, holding no setting of
  # the platform's but the node's secret, which it registers with. What
  # a worker is given of the settings above, the runtime sends with it.
  # Its folder is its own: the code it runs, the environments, the
  # workers' homes and what it writes down of them.
  #
  # Its network reaches the runtime and nothing else, so the runtime's
  # proxy is an agent's only way out. The right below sets one firewall
  # rule, in this container's own network and nowhere else: the users
  # kept for agents' workers reach the proxy's port and nothing else,
  # which keeps one agent from another inside the container. It is
  # used once, at start, and nothing started here ever holds it.
  # Without it the stack runs all the same, and says so.
  agents:
    build:
      context: .
      dockerfile: ai_runtime/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # What the agents are given together, of memory and of processor;
    # 0 is no limit. The engine holds the container to it, and the
    # spawner ends the agent using most before the engine has to.
    mem_limit: ${AGENTS_MEMORY:-0}
    cpus: ${AGENTS_CPUS:-0}
    command: ["python", "-m", "ai_runtime.agents_container.service"]
    # Stopped, it drains: it starts no new worker, and those running
    # finish what they are doing before it goes.
    stop_grace_period: 75s
    # The node's secret, which its Execution Sandboxes prove when they
    # register: in a file of its own (bootstrap/setup.py writes it),
    # given to the AI Runtime and its sandboxes and to nothing else.
    env_file: sandbox.env
    environment:
      AI_AGENTS_PROXY: ai-runtime:${AI_RUNTIME_EGRESS_PORT:-8002}
      AI_RUNTIME_EGRESS_PORT:
      # where it registers, who it is, and what it says of itself
      AI_SANDBOX_RUNTIME: ai-runtime:${AI_RUNTIME_SANDBOX_PORT:-8005}
      AI_SANDBOX_ID: agents
      AI_SANDBOX_LABELS: ${AGENTS_LABELS:-}
      # 0 turns off the filter on what system calls a worker may make;
      # the filter is written here, where workers run
      AI_RUNTIME_SYSCALL_FILTER:
      LOG_LEVEL:
      TZ:
    volumes:
      # The helper was built for this path: a sandbox's folder is here
      # in every sandbox, and is each sandbox's own.
      - sandbox_data:/data/agents
    networks:
      - agents
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8003), 4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The one door: plain HTTP on one port, from this computer only
  # unless deploy.env says otherwise (LISTEN, PORT). It sends the Data
  # Core's paths to the Data Core and every other path to the web client,
  # a repository of its own (decentai-web-client), wherever it runs
  # (gateway/Caddyfile).
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # The balancer in front, by its range, where there is one: whose
      # word Caddy takes for a client's address.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      # Where the web client serves its pages, where it is not its
      # container on this network (web-client) or `npm start` on this
      # computer's port 4200, which the gateway finds unsaid.
      WEB_CLIENT_UPSTREAM:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${LISTEN:-127.0.0.1}:${PORT:-4280}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

networks:
  # The database's: mongo, and the backend and the seeder that speak
  # to it. Nothing on it reaches the internet.
  data:
    internal: true
  # Between the AI Runtime and its Execution Sandboxes, and nowhere else:
  # nothing on it reaches the internet, the database or the backend.
  agents:
    internal: true

volumes:
  runtime_agents:
  sandbox_data:
  agent_packages:
  mongo_data:
  node_credential:
  speech_models:
  uploads_data:
