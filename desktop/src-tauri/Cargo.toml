[package]
name = "decentai-desktop"
version = "0.4.0"
description = "DecentAI on your own computer"
authors = ["The DecentAI Authors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "decentai_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# Started when the person signs in to the computer, where they chose that.
tauri-plugin-autostart = "2"
# The release file: fetched over HTTPS, believed for its signature.
ureq = "2"
ed25519-dalek = "2"
base64 = "0.22"
