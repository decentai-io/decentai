# Everything the images and workflows are built from is pinned: actions by commit, base images by digest, Python
# packages by version and hash (requirements.txt, made from requirements.in). This keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/api_server, /issuer, /runtime, /sandbox, /speech]
    schedule:
      interval: weekly
    # The images stay on Python 3.12, the sandbox's base that agents' programs are built for: only its digest moves.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # MongoDB moves a major version by a planned upgrade, not a bump: only its digest moves.
    ignore:
      - dependency-name: mongo
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directories: [/api_server, /issuer, /runtime, /sandbox, /speech]
    schedule:
      interval: weekly
