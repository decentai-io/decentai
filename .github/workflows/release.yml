# A release: the engine's five images, published under the version a
# tag names (v0.6.0), and a GitHub release that names each by digest,
# with the deploy bundle the stack runs from (decentai-engine-deploy-
# 0.6.0.tar.gz). Runs when a version is tagged. documentation/operating.md, "Releases",
# says how a version is cut and run.
#
# What it needs of the repository: nothing but its own token. The
# packages it publishes are private until made public once, on GitHub,
# after the first release.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  actions: read

env:
  IMAGES: ghcr.io/${{ github.repository_owner }}

jobs:
  # A tag on a commit whose tests did not pass is not released. The
  # tests run on the push to main; tag once they are green.
  tested:
    name: the commit's tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Look for a passing run of the tests on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow tests.yml --commit "$GITHUB_SHA" \
            --json conclusion,status \
            --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')
          echo "tests on ${GITHUB_SHA}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::The tests have not passed on this commit (${conclusion}). Tag a commit whose tests passed, or re-run this workflow once they have."
            exit 1
          fi

  image:
    name: ${{ matrix.image }}
    needs: tested
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api-server
            dockerfile: api_server/Dockerfile
          - image: ai-runtime
            dockerfile: runtime/Dockerfile
          - image: issuer
            dockerfile: issuer/Dockerfile
          - image: sandbox
            dockerfile: sandbox/Dockerfile
          - image: speech
            dockerfile: speech/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The version is the tag's
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Both processor types a server or a laptop has: Intel and AMD,
      # and ARM. Layers are kept between releases, so one that did not
      # change is not built again.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          tags: |
            ${{ env.IMAGES }}/decentai-${{ matrix.image }}:${{ steps.version.outputs.number }}
          labels: |
            org.opencontainers.image.title=decentai-${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Small-Business-1.0.0-DecentAI

      # A matrix job's outputs are the last one's, so each image leaves
      # its digest as a file the release collects.
      - name: Keep the digest
        run: |
          mkdir -p digests
          echo "${{ env.IMAGES }}/decentai-${{ matrix.image }}@${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 1

  release:
    name: the release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # The files the stack needs beside the images, at their paths in the repository, and images.json, which
      # names each image by digest: what the desktop's launcher runs a release from (decentai-desktop-app,
      # docs/plan.md §1).
      - name: The deploy bundle
        id: bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg api_server "$(cat digests/api-server)" \
            --arg ai_runtime "$(cat digests/ai-runtime)" \
            --arg issuer "$(cat digests/issuer)" \
            --arg sandbox "$(cat digests/sandbox)" \
            --arg speech "$(cat digests/speech)" \
            '{"api-server": $api_server, "ai-runtime": $ai_runtime, "issuer": $issuer, "sandbox": $sandbox,
              "speech": $speech}' > images.json
          bundle="decentai-engine-deploy-${version}.tar.gz"
          tar --create --gzip --file "$bundle" --owner=0 --group=0 --numeric-owner \
            deploy/docker-compose.yml \
            deploy/config/deploy.env.example \
            deploy/setup/issuer-account.js \
            sandbox/config/seccomp.json \
            tools/decentai_root.py \
            images.json
          tar --list --file "$bundle"
          echo "file=${bundle}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$bundle" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.bundle.outputs.file }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "The engine's images for ${version}, by digest:"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            for image in api-server ai-runtime issuer sandbox speech; do
              echo "| decentai-${image} | \`$(cat "digests/${image}")\` |"
            done
            echo
            echo "The deploy bundle, \`${BUNDLE}\`: the Compose file, the settings' template, the issuer's database"
            echo "account, the sandbox's seccomp profile, the root tool, and \`images.json\` (these digests)."
            echo "Its SHA-256: \`${BUNDLE_SHA256}\`."
            echo
            echo "To run it: \`DECENTAI_VERSION=${version}\` in deploy/config/deploy.env, then"
            echo "\`docker compose --env-file deploy/config/deploy.env pull\` and \`up -d --no-build\`"
            echo "(documentation/operating.md, Releases)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$BUNDLE" images.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "DecentAI engine ${version}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

      # The desktop app runs the engine: its release workflow is told there
      # is a new one, and releases the app with it, so installed apps update.
      # Without the token (a fine-grained token with Actions: write on
      # decentai-desktop-app), the desktop's daily check finds it instead.
      - name: Tell the desktop app's release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No DESKTOP_DISPATCH_TOKEN: the desktop app's daily check finds this release."
            exit 0
          fi
          gh api "repos/${{ github.repository_owner }}/decentai-desktop-app/dispatches" \
            -f event_type=engine-released -F "client_payload[version]=${GITHUB_REF_NAME#v}"
