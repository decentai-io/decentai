# The platform on one person's computer (docs/system/desktop-install.md).
#
# Started by the launcher, never by hand: it names the images of the
# release it installed, the port, and where it keeps the settings it
# made. The same containers a company deploys — what differs is what is
# around them: one port, on this machine only, in plain HTTP.
#
#   BACKEND_IMAGE, RUNTIME_IMAGE, FRONTEND_IMAGE   the release's images
#   PORT                                           where the person opens it
#   STATE                                          the launcher's own folder
#   PROJECT                                        what the engine knows it by
#
# The project's name is what its volumes are named after, so it is one
# nothing else on the machine uses: a developer's own stack, started
# from a folder called decentai, keeps its database to itself.
name: ${PROJECT}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file: ${STATE}/mongo.env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot and idempotent: the schema, the access chains and, the first
  # time, the first person. Run by the launcher before every start of a
  # new release, never by `up`.
  init:
    image: ${BACKEND_IMAGE}
    profiles: ["seed"]
    env_file: ${STATE}/backend.env
    # The first person is said once, to the seeder, and kept nowhere; so
    # is a new password `reset-password` sets (bootstrap/reset_password.py).
    environment:
      ADMIN_EMAIL:
      ADMIN_PASSWORD:
      ADMIN_NAME:
      RESET_EMAIL:
      RESET_PASSWORD:
    command: ["python", "/opt/decentai/bootstrap/init_db.py"]
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${STATE}/backend.env
    volumes:
      - uploads_data:/data/uploads
      - agent_packages:/data/agent-packages
    # Said here, not left to the image: Podman keeps an image's own
    # health check only for images in Docker's format, and a published
    # image is not in it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy

  # Agent code runs here. It is handed its own settings and nothing
  # else, and the one right its firewall rule needs (docs/system/sandbox.md).
  ai-runtime:
    image: ${RUNTIME_IMAGE}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file: ${STATE}/runtime.env
    volumes:
      - agents_data:/data/agents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health/live', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The one door, and only from this machine.
  caddy:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:${PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
  agent_packages:
  agents_data:
