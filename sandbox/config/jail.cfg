# The jail every process is in (documentation/sandbox.md#3-what-a-process-sees). Per process, the sandbox adds its
# user (-U, -G), its program at /program and its home (-R, -B), its way out, its environment and its command.
name: "process"
mode: ONCE
hostname: "process"
cwd: "/home/run"
time_limit: 0

clone_newnet: true      # a network of its own: nothing in it but its way out
clone_newcgroup: true

rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_fsize_type: INF
rlimit_nofile: 4096
rlimit_nproc_type: INF  # its threads and child processes are held by its cgroup
rlimit_stack_type: SOFT
rlimit_core: 0

mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/bin" dst: "/bin" is_bind: true }
mount { src: "/sbin" dst: "/sbin" is_bind: true }
mount { src: "/lib" dst: "/lib" is_bind: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true mandatory: false }
mount { src: "/etc" dst: "/etc" is_bind: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true rw: true }
mount { src: "/dev/random" dst: "/dev/random" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: true }
mount { src: "/proc/self/fd" dst: "/dev/fd" is_symlink: true }
mount { dst: "/dev/shm" fstype: "tmpfs" rw: true options: "size=256m" }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=1g" }
mount { dst: "/proc" fstype: "proc" }

# Refused to every process; calls the policy language doesn't name are given by number: io_uring (425-427) and
# clone3 (435), the same on both machines. clone3 is answered "no such call", so the C library falls back to clone,
# whose flags can be read.
seccomp_string: "ERRNO(1) {"
                "  ptrace, process_vm_readv, process_vm_writev, bpf, perf_event_open, userfaultfd,"
                "  SYSCALL[425], SYSCALL[426], SYSCALL[427],"
                "  init_module, finit_module, delete_module, kexec_load, kexec_file_load,"
                "  add_key, request_key, keyctl, open_by_handle_at, name_to_handle_at,"
                "  shmget, msgget, semget, mq_open,"
                "  mount, umount, pivot_root, unshare, setns,"
                "  clone { (clone_flags & 0x7e020000) != 0 },"
                "  socket(domain, type, protocol) { domain != 1 && domain != 2 && domain != 10 }"
                "}"
                "ERRNO(38) { SYSCALL[435] }"
                "DEFAULT ALLOW"
