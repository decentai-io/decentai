# A second Execution Sandbox beside the first, for trying many
# sandboxes on one machine (docs/system/sandbox.md, many sandboxes).
# Named among the stack's files in config/deploy.env,
#
#   COMPOSE_FILE=docker-compose.yml:compose/sandboxes.yml
#
# it is started with the rest, by `python bootstrap/setup.py` or
# `docker compose --env-file config/deploy.env up -d --build`.
#
# It is the first one again, with a name and a folder of its own: it
# registers with the same AI Runtime, proving the same node secret, and
# shares nothing with the runtime or the other sandbox. Agents spread
# between the two by the placement rule; stopping one moves its agents
# to the other on their next call.
services:
  sandbox-2:
    extends:
      # As every path in a file laid over another: from the project's
      # folder, the first file's (the repository root), not this one's.
      file: docker-compose.yml
      service: sandbox
    environment:
      AI_SANDBOX_ID: sandbox-2
      AI_SANDBOX_LABELS: ${SANDBOX_2_LABELS:-}
    volumes:
      - sandbox_2_data:/data/agents

volumes:
  sandbox_2_data:
