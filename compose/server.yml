# Laid over docker-compose.yml on a server with an address of its own:
# Caddy answers on 80 and 443 for SITE_ADDRESS, and obtains and renews
# its certificate by itself (docs/run/deploying.md). Named among the
# stack's files in config/deploy.env,
#
#   COMPOSE_FILE=docker-compose.yml:compose/server.yml
#
# it is started with the rest:
#
#   docker compose --env-file config/deploy.env up -d --build
services:
  gateway:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?the address people open, in config/deploy.env}
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      # Certificates, and the account they were issued to.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
